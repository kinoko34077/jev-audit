name: Create stable v0.2.12 tag

on:
  push:
    branches:
      - ops/stable-tag-v0.2.12

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create audited stable tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 13e11ef422643ac247e82685f771034eb0afa5e1
          TAG_REF: refs/tags/v0.2.12
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          existing_status="$(curl -sS -o existing.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/ref/tags/v0.2.12")"

          if [ "${existing_status}" = "200" ]; then
            existing_sha="$(jq -r '.object.sha' existing.json)"
            if [ "${existing_sha}" != "${TARGET_SHA}" ]; then
              echo "v0.2.12 already exists at unexpected object ${existing_sha}" >&2
              exit 1
            fi
            echo "v0.2.12 already points at the audited commit"
            exit 0
          fi

          if [ "${existing_status}" != "404" ]; then
            cat existing.json >&2
            exit 1
          fi

          payload="$(jq -nc --arg ref "${TAG_REF}" --arg sha "${TARGET_SHA}" '{ref:$ref,sha:$sha}')"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "${api}/git/refs" > created.json

          test "$(jq -r '.ref' created.json)" = "${TAG_REF}"
          test "$(jq -r '.object.sha' created.json)" = "${TARGET_SHA}"
          echo "Created ${TAG_REF} -> ${TARGET_SHA}"
