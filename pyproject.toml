[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-audit"
version = "0.1.0"
description = "Fast probabilistic directory auditing with TypeSafe AI Jev"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "KiNoTch."}]
dependencies = [
  "typesafe-sdk",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]

[project.scripts]
jev-audit = "jev_audit.cli:main"
jev-audit-mcp = "jev_audit.mcp_server:main"

[tool.setuptools]
packages = ["jev_audit"]

[tool.setuptools.package-data]
jev_audit = ["profiles/*.json"]
